<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="520" viewBox="0 0 1050 520" role="img" aria-label="Nyzeep Chromatic Terminal Profile">
  <defs>
    <!-- Deep Obsidian Slate Background -->
    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#090c13"/>
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#7000ff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ff007f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Dynamic Flowing Chromatic Gradient (Perfect 2x Period for Seamless Indefinite Loop) -->
    <linearGradient id="chroma-flow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="8.3%" stop-color="#4361ee"/>
      <stop offset="16.6%" stop-color="#7000ff"/>
      <stop offset="25%" stop-color="#b5179e"/>
      <stop offset="33.3%" stop-color="#f72585"/>
      <stop offset="41.6%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="58.3%" stop-color="#00f0ff"/>
      <stop offset="66.6%" stop-color="#4361ee"/>
      <stop offset="75%" stop-color="#7000ff"/>
      <stop offset="83.3%" stop-color="#b5179e"/>
      <stop offset="91.6%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#00f0ff"/>
      
    </linearGradient>

    <!-- Spec Box Background -->
    <linearGradient id="spec-box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a2b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e121e" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Luminous Chromatic Glow -->
    <filter id="chroma-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Ambient Dots Pattern -->
    <pattern id="dot-matrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#565f89" fill-opacity="0.08"/>
    </pattern>
  </defs>

