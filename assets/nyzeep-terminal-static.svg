    .hdr-title {
      fill: #8f9bb3;
      font-size: 12px;
    }
    .key {
      fill: #00f0ff;
      font-weight: 600;
      font-size: 13.5px;
    }
    .sep {
      fill: #3b4261;
      font-size: 13.5px;
    }
    .val {
