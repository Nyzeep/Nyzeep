<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Nyzeep static developer workbench</title>
  <desc id="desc">Static neon terminal workbench. Profile details appear in surrounding text.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#10232a"/>
      <stop offset="100%" stop-color="#1b1633"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c897"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#8b949e" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1082" cy="48" r="100" fill="#8b5cf6" opacity=".10"></circle>
  <circle cx="96" cy="298" r="110" fill="#00c897" opacity=".08"></circle>
  <path d="M0 266 C230 224 370 306 552 259 S888 222 1200 276" fill="none" stroke="url(#accent)" stroke-opacity=".42" stroke-width="2" filter="url(#glow)">
  </path>
  <g transform="translate(56 46)">
    <rect width="654" height="190" rx="16" fill="#0d1117" fill-opacity=".80" stroke="#30363d"/>
    <path d="M0 48 H654" stroke="#30363d"/>
    <circle cx="28" cy="24" r="7" fill="#ff6b6b"/><circle cx="52" cy="24" r="7" fill="#feca57"/><circle cx="76" cy="24" r="7" fill="#1dd1a1"/>
    <text x="34" y="112" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="56" font-weight="700" letter-spacing="3">NYZEEP</text>
    <rect x="36" y="154" width="250" height="5" rx="3" fill="#21262d"/>
    <rect x="36" y="154" width="166" height="5" rx="3" fill="url(#accent)"></rect>
  </g>
  <g transform="translate(796 70)">
    <g transform="translate(0 6)">
      <rect width="290" height="116" rx="14" fill="#0d1117" fill-opacity=".62" stroke="#30363d"/>
      <rect x="24" y="26" width="132" height="10" rx="5" fill="#00c897" opacity=".80"></rect>
      <rect x="24" y="55" width="210" height="8" rx="4" fill="#8b949e" opacity=".50"/>
      <rect x="24" y="78" width="162" height="8" rx="4" fill="#8b5cf6" opacity=".70"></rect>
      <circle cx="246" cy="46" r="13" fill="#feca57" filter="url(#glow)"></circle>
      <circle cx="246" cy="84" r="9" fill="#00c897" opacity=".9"></circle>
    </g>
  </g>
</svg>
